name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      # 本插件**零运行时依赖**（peerDependencies 全由 DSH 宿主提供），仓库里也没有
      # lockfile，因此不能开 `cache: npm`（setup-node 会因找不到锁文件直接失败），
      # 也不需要 install 步骤。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Static checks (lint)
        run: node scripts/check.mjs

      - name: Unit tests (offline)
        run: npm test

      - name: Smoke checks (offline)
        run: node scripts/smoke.mjs --offline

      - name: Pack contents (no internal docs)
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          if grep -qE '设计方案|复刻清单|handoff|ego-lite-兼容评估' pack.json; then
            echo "::error::发布包内含内部设计文档"
            exit 1
          fi
          echo "pack ok"